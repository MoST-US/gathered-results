# Publishes the SCALE analysis artifact (docs/) to GitHub Pages.
#   * push to main: deploys docs/ as committed (no recomputation).
#   * manual run: optionally recomputes the analysis first; the recomputed outputs are attached to the
#     run as a downloadable artifact so they can be compared with, or committed over, analysis/output.
# Requires Settings -> Pages -> Source: GitHub Actions.
name: artifact

on:
  push:
    branches: [main]
    paths: ["docs/**", "analysis/**", ".github/workflows/artifact.yml"]
  workflow_dispatch:
    inputs:
      recompute:
        description: "Recompute before deploying"
        type: choice
        options: [none, frequentist, full]
        default: none

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        if: inputs.recompute == 'frequentist' || inputs.recompute == 'full'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - name: Recompute analysis
        if: inputs.recompute == 'frequentist' || inputs.recompute == 'full'
        run: |
          python -m pip install -r analysis/requirements.txt
          if [ "${{ inputs.recompute }}" = "full" ]; then
            python analysis/run_all.py
          else
            python analysis/run_all.py --skip-bayes
          fi
      - name: Keep recomputed outputs
        if: inputs.recompute == 'frequentist' || inputs.recompute == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: recomputed-outputs
          path: |
            analysis/output/results.json
            analysis/output/mix_frequentist.csv
            analysis/output/run.log
            analysis/latex/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
