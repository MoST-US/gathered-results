# Publishes the SCALE analysis artifact (docs/) to GitHub Pages.
#   * push to main: deploys docs/ as committed (no recomputation).
#   * manual run: optionally recomputes the analysis first; the recomputed outputs are attached to the
#     run as a downloadable artifact so they can be compared with, or committed over, analysis/output.
# Requires Settings -> Pages -> Source: GitHub Actions.
#
# The repository tracks ~20 GB of request-level files (results_from_json.csv). Both checkouts are
# sparse and blob-filtered, so only docs/ (deploy) or the code plus the 1 KB results.csv summaries
# (recompute) are downloaded.
name: artifact

on:
  push:
    branches: [main]
    paths: ["docs/**", "analysis/**", ".github/workflows/artifact.yml"]
  workflow_dispatch:
    inputs:
      recompute:
        description: "Recompute before deploying"
        type: choice
        options: [none, frequentist, full]
        default: none

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RECOMPUTE: ${{ inputs.recompute || 'none' }}
    steps:
      - name: Checkout site only
        if: env.RECOMPUTE == 'none'
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/
      - name: Checkout code and run summaries
        if: env.RECOMPUTE != 'none'
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analysis/
            /docs/
            /MergeAllCsv.py
            /MergeExperimentCsv.py
            /MIT_MST_results/**/results.csv
      - name: Set up Python
        if: env.RECOMPUTE != 'none'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - name: Recompute analysis
        if: env.RECOMPUTE != 'none'
        run: |
          python -m pip install -r analysis/requirements.txt
          if [ "$RECOMPUTE" = "full" ]; then
            python analysis/run_all.py
          else
            python analysis/run_all.py --skip-bayes
          fi
      - name: Keep recomputed outputs
        if: env.RECOMPUTE != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: recomputed-outputs
          path: |
            analysis/output/results.json
            analysis/output/mix_frequentist.csv
            analysis/output/run.log
            analysis/latex/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
